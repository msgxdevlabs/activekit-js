# Auto-merge, self-hosted. Squash-merges a pull request that carries the
# `automerge` label once every other check on its head commit has finished
# green, then deletes the branch it merged, for the reasons written beside
# that step. GitHub's built-in auto-merge is plan-gated on private
# repositories (observed in this org's repository settings, 2026-08-31), and
# LOOP.md section 15 refuses an approver bot, which would add a check and no
# judgment. This adds neither a payment nor an approval: the judgment stays
# where it was, in the gate script, the design review, and CI. Attaching the
# label is the act that says "merge this when green", exactly what pressing
# the native auto-merge button says, and only a collaborator can attach it.
#
# The same file ships verbatim in activekit-play and activekit-js, so the
# mechanism reads identically across the three repositories.
#
# Three properties worth knowing before editing:
#   - The workflow_run trigger fires only from the copy of this file on the
#     default branch, so the pull request that first ships or edits it runs
#     the old copy, not its own. A pull_request run is the exception and uses
#     the branch's own copy, which is why labeling still works on such a
#     branch while the completion half does not.
#   - check_suite was the second trigger here from #139 until 2026-08-31, and
#     it could never fire. GitHub emits no workflow-triggering event for a
#     check suite that Actions itself created with GITHUB_TOKEN, which is its
#     recursion guard, and every check suite in these three repositories comes
#     from ci.yml on that token. Measured rather than reasoned: all four runs
#     this workflow had were pull_request runs. So it merged only what was
#     already green at the moment the label was attached, which is precisely
#     the case a merge-on-green workflow exists to remove. workflow_run is the
#     documented way to react to a workflow finishing without meeting that
#     guard, and it replaces check_suite rather than joining it: a branch that
#     cannot run is a branch nobody can prove, and it reads as coverage while
#     providing none. Do not put it back.
#   - Every skip below exits green. A "not ready" outcome is ordinary and
#     retried by the next event; a red run here would train everyone to
#     ignore red, which is the one thing a merge gate cannot afford.
name: automerge

on:
  pull_request:
    types: [labeled, ready_for_review]
  # Both spellings of the CI workflow's name, because the three repositories
  # disagree and this file is byte-identical in all of them: activekit-io and
  # activekit-js declare `name: CI`, activekit-play declares `name: ci`, and
  # the match here is case-sensitive. A name no workflow in the repository
  # carries is inert, so listing both costs nothing, while dropping either
  # silently disables merge-on-green in one repository and leaves the other
  # two looking healthy.
  workflow_run:
    workflows: [CI, ci]
    types: [completed]

# checks: read is load-bearing: the run lists the head commit's check runs
# to decide green, and a permissions block grants nothing it does not name.
# Its absence was this workflow's first live failure (io #140, 2026-08-31):
# the labeled draft was marked ready, then the check-runs read answered 403.
permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  automerge:
    name: automerge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge labeled pull requests whose checks are green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A pull_request event names one candidate; a workflow_run event
          # names every open pull request whose head is the finished run's
          # commit. That list is empty for a run on a plain branch push and
          # empty when the head branch lives in a fork, and either ends the
          # run here. `// []` because the field is absent rather than empty
          # on some payloads, where a bare `[]` would make jq exit non-zero
          # and `set -e` would turn "nothing to do" into a red run.
          case "$GITHUB_EVENT_NAME" in
            pull_request) nums=$(jq '.pull_request.number' "$GITHUB_EVENT_PATH") ;;
            workflow_run) nums=$(jq -r '(.workflow_run.pull_requests // [])[].number' "$GITHUB_EVENT_PATH") ;;
            *)            nums="" ;;
          esac
          [ -n "$nums" ] || { echo "no pull request in this event"; exit 0; }

          default_branch=$(gh api "repos/$REPO" -q .default_branch)

          for n in $nums; do
            pr=$(gh api "repos/$REPO/pulls/$n")
            state=$(jq -r .state <<<"$pr")
            base=$(jq -r .base.ref <<<"$pr")
            labeled=$(jq -r '[.labels[].name] | index("automerge") != null' <<<"$pr")
            sha=$(jq -r .head.sha <<<"$pr")

            [ "$state" = open ] || { echo "#$n is $state; skipping"; continue; }
            [ "$labeled" = true ] || { echo "#$n carries no automerge label; skipping"; continue; }

            # A release-* base would let a label reach what LOOP.md section 6
            # puts outside loop scope, so only the default branch qualifies.
            [ "$base" = "$default_branch" ] || {
              echo "#$n targets $base, not $default_branch; refusing"; continue; }

            # The label is the intent, so a labeled draft is marked ready
            # here. gh uses GraphQL for this, which the REST API cannot do.
            if [ "$(jq -r .draft <<<"$pr")" = true ]; then
              gh pr ready "$n" -R "$REPO"
            fi

            # Every check run on the head commit except this workflow's own,
            # which is in progress while it reads. Zero checks is a wait, not
            # a pass: an empty suite must never merge anything.
            runs=$(gh api "repos/$REPO/commits/$sha/check-runs" --paginate \
              -q '.check_runs[] | select(.name != "automerge") | {name, status, conclusion}' | jq -s .)
            total=$(jq length <<<"$runs")
            [ "$total" -gt 0 ] || { echo "#$n has no checks on $sha yet; waiting"; continue; }

            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            [ "$pending" -eq 0 ] || { echo "#$n: $pending checks still running; waiting"; continue; }

            red=$(jq '[.[] | select(.conclusion != "success"
              and .conclusion != "neutral" and .conclusion != "skipped")] | length' <<<"$runs")
            [ "$red" -eq 0 ] || {
              echo "#$n: a check did not pass:"
              jq -r '.[] | "  \(.name): \(.conclusion)"' <<<"$runs"
              continue; }

            if gh api -X PUT "repos/$REPO/pulls/$n/merge" -f merge_method=squash >/dev/null; then
              echo "#$n merged"
            else
              echo "#$n did not merge (conflict, or the base moved); the next event retries"
              continue
            fi

            # A squash merge does not delete the branch it merged, and the
            # setting that would, "Automatically delete head branches", is a
            # per-repository checkbox no file in the repository can assert or
            # even read. So a merged branch survives on origin until somebody
            # clears it by hand, and that is what had been happening: on
            # 2026-09-02, fifteen of the twenty-two branches on origin in
            # activekit-io were the head of a pull request that had already
            # merged, thirteen of them the loop's own `wt/*`, counted by
            # intersecting the merged pull requests' head refs with the remote
            # branch list. Deleting here keeps the behavior in the one file
            # that ships byte-identical in all three repositories, where it is
            # read rather than remembered and reviewed like any other change.
            # `permissions:` above already grants `contents: write` for the
            # merge, and a ref delete needs that same scope, so nothing is
            # added there.
            #
            # Every outcome below exits green, for the reason the header
            # gives. The merge already happened; a branch left standing is a
            # tidiness matter, and letting it color the run would train
            # everyone to ignore a red merge gate.
            head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr")
            head_ref=$(jq -r .head.ref <<<"$pr")

            # A fork's head branch lives in a repository this token cannot
            # write, so deleting it is impossible rather than merely unwanted,
            # and trying would print a failure on a completely ordinary
            # outcome.
            [ "$head_repo" = "$REPO" ] || {
              echo "#$n came from $head_repo; its branch is not ours to delete"; continue; }

            # The base is what everything merges into, and the guard above has
            # already held it to the default branch. GitHub refuses to delete
            # it, and the refusal is the only thing standing between a bad
            # payload and the branch this whole repository sits on.
            [ "$head_ref" != "$base" ] || {
              echo "#$n head is $base itself; leaving it"; continue; }

            # A protected branch is one somebody decided cannot be deleted, so
            # ask before acting. Only a plain false proceeds: an error, an
            # empty answer or a branch that no longer reads all keep the
            # branch, because this step guesses in the direction of leaving
            # work alone.
            protected=$(gh api "repos/$REPO/branches/$head_ref" -q .protected 2>/dev/null) \
              || protected=unreadable
            [ "$protected" = false ] || {
              echo "#$n head $head_ref reads protected=${protected:-empty}; leaving it"; continue; }

            # 422 is also the answer when the ref is already gone, which is
            # ordinary rather than exceptional: a person, or a second event on
            # the same merge, may have deleted it first. Nothing here turns a
            # successful merge into a red run.
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$head_ref" >/dev/null 2>&1; then
              echo "#$n head branch $head_ref deleted"
            else
              echo "#$n head branch $head_ref was not deleted (already gone, or refused); the merge stands"
            fi
          done
