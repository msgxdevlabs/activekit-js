name: CI

# Every PR and every push to main. Releases nothing — publishing is manual and
# lives in release.yml, the same shape as the product repo's production deploy.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build, test, size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # changeset status compares against the base branch, so a shallow
          # clone has nothing to compare with.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile is the point of committing one: an install that
      # silently resolves something new is an install that can publish
      # something new.
      - run: pnpm install --frozen-lockfile

      # build → typecheck → test → publint → size, in that order, and the
      # order is load-bearing. The bindings import `@activekit/js` through its
      # exports map, which points at dist/index.d.ts — so on a fresh checkout
      # nothing downstream of it can typecheck until it has been built. Tests
      # run against dist/ for the same reason.
      - name: Check
        run: pnpm check

      # Runs even on failure: knowing what a red build would have released is
      # exactly when it is most useful.
      - name: Summarize what would be released
        if: always()
        run: pnpm changeset status --verbose >> "$GITHUB_STEP_SUMMARY" || true

  changeset:
    name: Changeset present
    # A PR that changes a package without a changeset ships as whatever the
    # last bump happened to be. Add an empty one (`pnpm changeset --empty`) for
    # changes that genuinely release nothing — docs, CI, tests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require a changeset
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
