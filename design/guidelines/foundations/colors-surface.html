<!-- @dsCard group="Colors" viewport="700x176" name="Surfaces & hairlines" subtitle="Cards on white, page on cool off-white, violet band as the interlude" -->
<!doctype html><html><head><meta charset="utf-8"><title>Surfaces & hairlines</title><link rel="stylesheet" href="../../styles.css"><style>body{background:var(--canvas);margin:0;padding:var(--space-xl);font-family:var(--font-sans)}.sw{display:flex;gap:var(--space-md)}
.s{flex:1;display:flex;flex-direction:column;gap:var(--space-sm)}
.chip{height:56px;border-radius:var(--radius-md);border:var(--border-width-hairline) solid var(--hairline)}
.n{font-size:var(--caption-size);letter-spacing:var(--caption-ls);color:var(--ink);font-weight:500}
.h{font-size:var(--micro-size);letter-spacing:var(--micro-ls);color:var(--ink-mute);font-feature-settings:var(--font-feature-numeric)}</style></head><body><div class="sw"><div class="s"><div class="chip" style="background:var(--canvas)"></div><div class="n">Canvas</div><div class="h">--canvas<br>#ffffff</div></div><div class="s"><div class="chip" style="background:var(--canvas-soft)"></div><div class="n">Canvas Soft</div><div class="h">--canvas-soft<br>#f7fbff</div></div><div class="s"><div class="chip" style="background:var(--canvas-violet)"></div><div class="n">Canvas Violet</div><div class="h">--canvas-violet<br>#f2efff</div></div><div class="s"><div class="chip" style="background:var(--hairline)"></div><div class="n">Hairline</div><div class="h">--hairline<br>#dbe6ef</div></div><div class="s"><div class="chip" style="background:var(--hairline-input)"></div><div class="n">Hairline Input</div><div class="h">--hairline-input<br>#d1dee9</div></div></div></body></html>
