<!-- @dsCard group="Brand" viewport="700x170" name="Brand gradients" subtitle="135° on buttons, 145° on panels, blue holding the mid-stop at 60%" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:var(--space-xl);background:var(--canvas);font-family:var(--font-sans)}
.wrap{display:flex;gap:var(--space-xl);align-items:stretch}
.i{flex:1;display:flex;flex-direction:column;gap:var(--space-sm)}
.t{font-size:var(--micro-size);color:var(--ink-mute);letter-spacing:var(--micro-ls)}
.t b{display:block;font-size:var(--caption-size);color:var(--ink-secondary);font-weight:500}
.stops{display:flex;gap:2px}.stops span{flex:1;height:10px;border-radius:var(--radius-xs)}
</style></head><body>
<div class="wrap">
<div class="i"><div style="height:76px;border-radius:var(--radius-lg);background:var(--brand-gradient-panel)"></div><div class="t"><b>--brand-gradient-panel · 145°</b>panels, oversized surfaces</div></div>
<div class="i"><div style="height:76px;display:flex;align-items:center;justify-content:center"><span style="background:var(--brand-gradient-button);color:var(--on-primary);border-radius:var(--radius-pill);padding:var(--pad-button);font-size:var(--button-md-size);line-height:var(--button-md-lh)">Start free</span></div><div class="t"><b>--brand-gradient-button · 135°</b>reserved; the flat teal pill is the default</div></div>
<div class="i"><div class="stops" style="height:76px;align-items:center"><span style="background:var(--gradient-aqua)"></span><span style="background:var(--primary)"></span><span style="background:var(--gradient-blue)"></span><span style="background:var(--purple)"></span><span style="background:var(--gradient-lavender)"></span></div><div class="t"><b>Wash stops</b>aqua · teal · blue · purple · lavender</div></div>
</div>
</body></html>
