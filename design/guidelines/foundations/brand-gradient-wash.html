<!-- @dsCard group="Brand" viewport="700x320" name="Subtle gradient wash" subtitle="Large blurred orbs across the upper third: the brand's depth system" -->
<!doctype html><html><head><meta charset="utf-8"><title>Gradient wash</title><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--canvas);font-family:var(--font-sans);overflow:hidden}
.page{position:relative;height:320px;background:var(--canvas);overflow:hidden}
.wash{position:absolute;inset:0 0 auto 0;height:var(--wash-height);pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(56px);opacity:0.34}
.content{position:relative;padding:var(--space-lg) var(--space-xl) 0}
.nav{display:flex;align-items:center;justify-content:space-between;padding-bottom:var(--space-xl)}
.mark{font-family:var(--font-display);font-size:var(--heading-lg-size);font-weight:700;letter-spacing:var(--display-md-ls);color:var(--ink)}
.mark i{font-style:normal;color:var(--purple)}
.links{display:flex;gap:var(--space-lg);font-size:var(--caption-size);color:var(--ink-mute-2);letter-spacing:var(--caption-ls)}
h1{font-family:var(--font-display);font-size:var(--display-xl-size);font-weight:var(--display-xl-weight);line-height:var(--display-xl-lh);letter-spacing:var(--display-xl-ls);color:var(--ink);max-width:19ch;margin:0}
p{margin:var(--space-md) 0 var(--space-lg);font-size:var(--body-lg-size);line-height:var(--body-lg-lh);color:var(--ink-secondary);max-width:62ch}
.pill{display:inline-flex;align-items:center;background:var(--cta-fill);color:var(--cta-on-fill);border-radius:var(--radius-pill);padding:var(--pad-button);font-size:var(--button-md-size);line-height:var(--button-md-lh)}
</style></head><body>
<div class="page">
  <div class="wash">
    <div class="orb" style="width:340px;height:200px;left:-120px;top:-96px;background:var(--wash-orb-aqua)"></div>
    <div class="orb" style="width:220px;height:150px;left:74px;top:-58px;background:var(--wash-orb-teal)"></div>
    <div class="orb" style="width:300px;height:210px;left:246px;top:-118px;background:var(--wash-orb-blue)"></div>
    <div class="orb" style="width:190px;height:130px;left:404px;top:-44px;background:var(--wash-orb-purple)"></div>
    <div class="orb" style="width:320px;height:220px;left:512px;top:-104px;background:var(--wash-orb-lavender)"></div>
    <div class="orb" style="width:170px;height:120px;left:596px;top:-32px;background:var(--wash-orb-purple)"></div>
  </div>
  <div class="content">
    <div class="nav"><div class="mark">Active<i>Kit</i></div><div class="links"><span>Campaigns</span><span>Developers</span><span>Pricing</span></div></div>
    <h1>Growth loops that pay out.</h1>
    <p>Launch referral, streak, and win-back campaigns against your own credit ledger, no growth engineer required.</p>
    <span class="pill">Start free</span>
  </div>
</div>
</body></html>
