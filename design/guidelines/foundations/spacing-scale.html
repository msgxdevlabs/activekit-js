<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="8px base with 2 / 4 / 12 sub-tokens for fine work" -->
<!doctype html><html><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="../../styles.css"><style>body{background:var(--canvas);margin:0;padding:var(--space-xl);font-family:var(--font-sans)}.wrap{display:flex;align-items:flex-end;gap:var(--space-xl)}
.i{display:flex;flex-direction:column;gap:var(--space-sm);align-items:flex-start}
.bar{background:var(--primary);height:24px;border-radius:var(--radius-xs)}
.t{font-size:var(--micro-size);color:var(--ink-mute);letter-spacing:var(--micro-ls);font-feature-settings:var(--font-feature-numeric)}
.t b{display:block;font-size:var(--caption-size);color:var(--ink-secondary);font-weight:500}</style></head><body>
<div class="wrap"><div class="i"><div class="bar" style="width:2px"></div><div class="t"><b>xxs</b>2px</div></div><div class="i"><div class="bar" style="width:4px"></div><div class="t"><b>xs</b>4px</div></div><div class="i"><div class="bar" style="width:8px"></div><div class="t"><b>sm</b>8px</div></div><div class="i"><div class="bar" style="width:12px"></div><div class="t"><b>md</b>12px</div></div><div class="i"><div class="bar" style="width:16px"></div><div class="t"><b>lg</b>16px</div></div><div class="i"><div class="bar" style="width:24px"></div><div class="t"><b>xl</b>24px</div></div><div class="i"><div class="bar" style="width:32px"></div><div class="t"><b>xxl</b>32px</div></div><div class="i"><div class="bar" style="width:64px"></div><div class="t"><b>huge</b>64px</div></div></div>
</body></html>
