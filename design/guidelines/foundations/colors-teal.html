<!doctype html><html><head><meta charset="utf-8"><title>Teal: the single CTA colour</title><link rel="stylesheet" href="../../styles.css"><style>body{background:var(--canvas);margin:0;padding:var(--space-xl);font-family:var(--font-sans)}.sw{display:flex;gap:var(--space-md)}
.s{flex:1;display:flex;flex-direction:column;gap:var(--space-sm)}
.chip{height:56px;border-radius:var(--radius-md);border:var(--border-width-hairline) solid var(--hairline)}
.n{font-size:var(--caption-size);letter-spacing:var(--caption-ls);color:var(--ink);font-weight:500}
.h{font-size:var(--micro-size);letter-spacing:var(--micro-ls);color:var(--ink-mute);font-feature-settings:var(--font-feature-numeric)}</style></head><body><div class="sw"><div class="s"><div class="chip" style="background:var(--primary)"></div><div class="n">Primary</div><div class="h">--primary<br>#00a7a0</div></div><div class="s"><div class="chip" style="background:var(--primary-deep)"></div><div class="n">Deep</div><div class="h">--primary-deep<br>#087f7a</div></div><div class="s"><div class="chip" style="background:var(--primary-press)"></div><div class="n">Press</div><div class="h">--primary-press<br>#087a76</div></div><div class="s"><div class="chip" style="background:var(--primary-soft)"></div><div class="n">Soft</div><div class="h">--primary-soft<br>#15c6bc</div></div><div class="s"><div class="chip" style="background:var(--primary-deeper)"></div><div class="n">Deeper</div><div class="h">--primary-deeper<br>#04605c</div></div><div class="s"><div class="chip" style="background:var(--primary-deepest)"></div><div class="n">Deepest</div><div class="h">--primary-deepest<br>#024744</div></div><div class="s"><div class="chip" style="background:var(--primary-bg-subdued-hover)"></div><div class="n">Subdued</div><div class="h">--primary-bg-subdued-hover<br>#e4f8f6</div></div></div></body></html>
