<!doctype html><html><head><meta charset="utf-8"><title>Micro</title><link rel="stylesheet" href="../../styles.css"><style>body{background:var(--canvas);margin:0;padding:var(--space-xl);font-family:var(--font-sans)}.row{display:flex;align-items:baseline;gap:var(--space-xl);padding:var(--space-sm) 0;border-bottom:var(--border-width-hairline) solid var(--hairline)}
.row:last-child{border-bottom:none}
.meta{flex:0 0 168px;font-size:var(--micro-size);color:var(--ink-mute);letter-spacing:var(--micro-ls);font-feature-settings:var(--font-feature-numeric)}
.meta b{display:block;font-size:var(--caption-size);font-weight:500;color:var(--ink-secondary);letter-spacing:var(--caption-ls)}
.spec{flex:1;color:var(--ink);min-width:0;overflow:hidden;white-space:nowrap}</style></head><body>

<div class="row"><div class="meta"><b>micro-cap</b>10 / 1.15 / +0.1</div><div class="spec ak-micro-cap">All-caps eyebrow</div></div>
</body></html>
