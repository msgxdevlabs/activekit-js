<!-- @dsCard group="Colors" viewport="700x176" name="Accents & gradient stops" subtitle="Wash stops and chart highlights, never flat button fills" -->
<!doctype html><html><head><meta charset="utf-8"><title>Accents & gradient stops</title><link rel="stylesheet" href="../../styles.css"><style>body{background:var(--canvas);margin:0;padding:var(--space-xl);font-family:var(--font-sans)}.sw{display:flex;gap:var(--space-md)}
.s{flex:1;display:flex;flex-direction:column;gap:var(--space-sm)}
.chip{height:56px;border-radius:var(--radius-md);border:var(--border-width-hairline) solid var(--hairline)}
.n{font-size:var(--caption-size);letter-spacing:var(--caption-ls);color:var(--ink);font-weight:500}
.h{font-size:var(--micro-size);letter-spacing:var(--micro-ls);color:var(--ink-mute);font-feature-settings:var(--font-feature-numeric)}</style></head><body><div class="sw"><div class="s"><div class="chip" style="background:var(--gradient-aqua)"></div><div class="n">Aqua</div><div class="h">--gradient-aqua<br>#7ce8e2</div></div><div class="s"><div class="chip" style="background:var(--gradient-blue)"></div><div class="n">Blue</div><div class="h">--gradient-blue<br>#087fd9</div></div><div class="s"><div class="chip" style="background:var(--purple)"></div><div class="n">Purple</div><div class="h">--purple<br>#6b4cf6</div></div><div class="s"><div class="chip" style="background:var(--gradient-lavender)"></div><div class="n">Lavender</div><div class="h">--gradient-lavender<br>#c8b8ff</div></div><div class="s"><div class="chip" style="background:var(--ruby)"></div><div class="n">Pink</div><div class="h">--ruby<br>#ef4da8</div></div><div class="s"><div class="chip" style="background:var(--amber)"></div><div class="n">Amber</div><div class="h">--amber<br>#f59e0b</div></div></div></body></html>
