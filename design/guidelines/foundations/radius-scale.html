<!-- @dsCard group="Shape" viewport="700x170" name="Radius scale" subtitle="Buttons and tags are always the 9999px pill, never a rounded rect" -->
<!doctype html><html><head><meta charset="utf-8"><title>Radius</title><link rel="stylesheet" href="../../styles.css"><style>body{background:var(--canvas);margin:0;padding:var(--space-xl);font-family:var(--font-sans)}.wrap{display:flex;gap:var(--space-lg)}
.i{flex:1;display:flex;flex-direction:column;gap:var(--space-sm)}
.box{height:64px;background:var(--canvas-soft);border:var(--border-width-hairline) solid var(--hairline);box-shadow:var(--elevation-1)}
.t{font-size:var(--micro-size);color:var(--ink-mute);letter-spacing:var(--micro-ls);font-feature-settings:var(--font-feature-numeric)}
.t b{display:block;font-size:var(--caption-size);color:var(--ink-secondary);font-weight:500}</style></head><body>
<div class="wrap"><div class="i"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="t"><b>xs · 4px</b>tags, table chrome</div></div><div class="i"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="t"><b>sm · 6px</b>inputs</div></div><div class="i"><div class="box" style="border-radius:var(--radius-md)"></div><div class="t"><b>md · 8px</b>compact cards</div></div><div class="i"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="t"><b>lg · 12px</b>feature & pricing</div></div><div class="i"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="t"><b>xl · 16px</b>mockup chrome</div></div><div class="i"><div class="box" style="border-radius:var(--radius-pill)"></div><div class="t"><b>pill · 9999px</b>all buttons</div></div></div>
</body></html>
