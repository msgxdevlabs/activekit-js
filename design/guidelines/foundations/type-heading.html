<!doctype html><html><head><meta charset="utf-8"><title>Headings</title><link rel="stylesheet" href="../../styles.css"><style>body{background:var(--canvas);margin:0;padding:var(--space-xl);font-family:var(--font-sans)}.row{display:flex;align-items:baseline;gap:var(--space-xl);padding:var(--space-sm) 0;border-bottom:var(--border-width-hairline) solid var(--hairline)}

.meta{flex:0 0 168px;font-size:var(--micro-size);color:var(--ink-mute);letter-spacing:var(--micro-ls);font-feature-settings:var(--font-feature-numeric)}
.meta b{display:block;font-size:var(--caption-size);font-weight:500;color:var(--ink-secondary);letter-spacing:var(--caption-ls)}
