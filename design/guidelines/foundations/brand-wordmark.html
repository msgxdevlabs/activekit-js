<!-- @dsCard group="Brand" viewport="700x170" name="Wordmark" subtitle="Space Grotesk 700, second half in purple on light and teal-soft on slate" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:var(--space-xl);background:var(--canvas);font-family:var(--font-sans)}
.wrap{display:flex;align-items:center;gap:var(--space-huge)}
.mark{font-family:var(--font-display);font-weight:700}
.mark i{font-style:normal;color:var(--purple)}
.on-dark{background:var(--brand-dark-900);color:var(--on-primary);padding:var(--space-lg) var(--space-xl);border-radius:var(--radius-lg)}
.note{font-size:var(--micro-size);color:var(--ink-mute);line-height:var(--micro-lh);max-width:30ch}
</style></head><body>
<div class="wrap">
<div class="mark" style="font-size:var(--display-lg-size);letter-spacing:var(--display-lg-ls);color:var(--ink)">Active<i>Kit</i></div>
<div class="mark on-dark" style="font-size:var(--display-md-size);letter-spacing:var(--display-md-ls)">Active<i style="color:var(--primary-soft)">Kit</i></div>
<div class="note">The wordmark on its own, for running text and anywhere the tile would crowd. The full lockup is the <b>Logo</b> component, and that is what nav, footer, sidebar, and auth render.</div>
</div>
</body></html>
