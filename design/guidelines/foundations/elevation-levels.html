<!-- @dsCard group="Shape" viewport="700x200" name="Elevation" subtitle="Two literal shadows; the gradient wash is level 3" -->
<!doctype html><html><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../../styles.css"><style>body{background:var(--canvas);margin:0;padding:var(--space-xl);font-family:var(--font-sans)}body{background:var(--canvas-soft)}
.wrap{display:flex;gap:var(--space-xl)}
.i{flex:1;display:flex;flex-direction:column;gap:var(--space-md)}
.box{height:88px;background:var(--canvas);border:var(--border-width-hairline) solid var(--hairline);border-radius:var(--radius-lg)}
.t{font-size:var(--micro-size);color:var(--ink-mute);letter-spacing:var(--micro-ls)}
.t b{display:block;font-size:var(--caption-size);color:var(--ink-secondary);font-weight:500}
.wash{position:relative;overflow:hidden;border:none}
.orb{position:absolute;border-radius:50%;filter:blur(28px);opacity:var(--wash-opacity)}</style></head><body>
<div class="wrap">
<div class="i"><div class="box" style="box-shadow:var(--elevation-0)"></div><div class="t"><b>Level 0 · flat</b>default surface</div></div>
<div class="i"><div class="box" style="box-shadow:var(--elevation-1)"></div><div class="t"><b>Level 1</b>card lift on white</div></div>
<div class="i"><div class="box" style="box-shadow:var(--elevation-2)"></div><div class="t"><b>Level 2</b>mockup chrome, panels</div></div>
<div class="i"><div class="box wash"><div class="orb" style="width:120px;height:120px;left:-20px;top:-30px;background:var(--wash-orb-aqua)"></div><div class="orb" style="width:120px;height:120px;left:50px;top:10px;background:var(--wash-orb-blue)"></div><div class="orb" style="width:130px;height:130px;left:110px;top:-30px;background:var(--wash-orb-purple)"></div></div><div class="t"><b>Level 3 · wash</b>atmospheric colour</div></div>
</div>
</body></html>
