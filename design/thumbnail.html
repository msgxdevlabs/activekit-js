<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%;background:var(--primary)}
.tile{display:flex;width:1280px;height:854px}
.main{flex:1;background:var(--primary);display:flex;align-items:center;justify-content:center;gap:44px;padding:0 56px}
.mark{width:170px;height:170px;flex:0 0 auto}
.name{font-family:var(--font-display);font-weight:700;font-size:148px;letter-spacing:-7.5px;color:var(--on-primary);white-space:nowrap;line-height:1}
.strip{width:300px;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head><body>
<div class="tile">
  <div class="main"><img class="mark" src="assets/logo.svg" alt=""><div class="name">ActiveKit</div></div>
  <div class="strip">
    <div style="background:var(--gradient-lavender)"></div>
    <div style="background:var(--amber)"></div>
    <div style="background:var(--ruby)"></div>
    <div style="background:var(--purple)"></div>
  </div>
</div>
</body></html>
