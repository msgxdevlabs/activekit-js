<!-- @dsCard group="Components" viewport="960x620" name="Modals and prompts" subtitle="Confirm, prompt, destructive, completion · one shell, four tones" -->
<!doctype html><html><head><meta charset="utf-8"><title>Modals and prompts</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:var(--space-xl);background:var(--canvas-soft);font-family:var(--font-sans)}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-lg);align-items:start}
.slot{border-radius:var(--radius-card);overflow:hidden;background:var(--canvas)}
.cap{font-size:var(--micro-cap-size);letter-spacing:var(--micro-cap-ls);text-transform:uppercase;color:var(--ink-mute);margin-bottom:var(--space-sm)}
.sum{display:flex;flex-direction:column;gap:var(--space-sm);padding:var(--space-md);background:var(--canvas-soft);border:var(--border-width-hairline) solid var(--hairline);border-radius:var(--radius-md)}
.line{display:flex;align-items:center;justify-content:space-between;gap:var(--space-lg);font-size:var(--body-tabular-size);color:var(--ink-secondary)}
.line b{font-weight:600;font-feature-settings:var(--font-feature-numeric);color:var(--ink)}
</style></head><body><div id="root"></div>
<script type="text/babel">
const { Modal, Button, Input, Icon } = window.ActiveKitDesignSystem_5626a0;
const Danger = (p) => <Button {...p} variant="primary" size="sm" style={{background:'linear-gradient(135deg, #f471b8 0%, var(--ruby) 100%)',boxShadow:'rgba(239,77,168,0.24) 0 6px 16px'}} />;

ReactDOM.createRoot(document.getElementById('root')).render(
  <>
    <div className="wrap">
      <div>
        <div className="cap">Confirm, md</div>
        <div className="slot">
          <Modal inline tone="brand" icon="campaigns"
            title="Launch Refer a builder?"
            description="Enrolment opens as soon as you launch and payouts draw from your credit balance."
            footnote="You can pause a campaign at any time."
            actions={<><Button variant="ghost" size="sm">Cancel</Button><Button variant="primary" size="sm">Launch campaign</Button></>}>
            <div className="sum">
              <div className="line"><span>Reward per referral</span><b>250 credits</b></div>
              <div className="line"><span>Monthly cap</span><b>25,000 credits</b></div>
              <div className="line"><span>Audience</span><b>All builders</b></div>
            </div>
          </Modal>
        </div>
      </div>

      <div>
        <div className="cap">Prompt, sm</div>
        <div className="slot">
          <Modal inline size="sm" tone="neutral"
            title="Name this campaign"
            description="Names show in the ledger, so make it something you will recognise in six months."
            actions={<><Button variant="ghost" size="sm">Cancel</Button><Button variant="primary" size="sm">Save name</Button></>}>
            <Input label="Campaign name" defaultValue="Win-back, lapsed 30 days" fullWidth />
          </Modal>
        </div>
      </div>

      <div>
        <div className="cap">Destructive, not dismissible</div>
        <div className="slot">
          <Modal inline size="sm" tone="danger" icon="alert" dismissible={false}
            title="Delete this campaign?"
            description="Deleting removes the campaign and its enrolment history. Payouts already made stay in the ledger."
            footnote="This cannot be undone."
            actions={<><Button variant="ghost" size="sm">Keep it</Button><Danger>Delete campaign</Danger></>} />
        </div>
      </div>

      <div>
        <div className="cap">Completion</div>
        <div className="slot">
          <Modal inline size="sm" tone="success" icon="check"
            title="Campaign is live"
            description="Refer a builder started enrolling members. First payouts usually clear within a day."
            actions={<><Button variant="ghost" size="sm">Close</Button><Button variant="primary" size="sm" iconRight={<Icon name="arrowRight" size="sm" />}>View campaign</Button></>} />
        </div>
      </div>
    </div>
  </>
);
</script></body></html>
