<!-- @dsCard group="Components" viewport="900x620" name="Loading states" subtitle="Every interaction that waits: button, row, page, table, progress, dark chrome" -->
<!doctype html><html><head><meta charset="utf-8"><title>Loading states</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:var(--space-xl);background:var(--canvas-soft);font-family:var(--font-sans)}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-lg);align-items:start}
.panel{background:var(--canvas);border:var(--border-width-hairline) solid var(--hairline);border-radius:var(--radius-card);box-shadow:var(--elevation-1);padding:var(--space-lg);display:flex;flex-direction:column;gap:var(--space-md)}
.panel.dark{background:var(--surface-dark-gradient);border-color:rgba(255,255,255,0.10)}
.cap{font-size:var(--micro-cap-size);letter-spacing:var(--micro-cap-ls);text-transform:uppercase;color:var(--ink-mute)}
.dark .cap{color:rgba(255,255,255,0.52)}
.row{display:flex;align-items:center;gap:var(--space-md);flex-wrap:wrap}
.trow{display:flex;align-items:center;gap:var(--space-md);padding:var(--space-md) 0;border-top:var(--border-width-hairline) solid var(--hairline)}
.metric{display:flex;flex-direction:column;gap:var(--space-sm);padding:var(--space-md);border:var(--border-width-hairline) solid var(--hairline);border-radius:var(--radius-md)}
.span2{grid-column:span 2}
</style></head><body><div id="root"></div>
<script type="text/babel">
const { Button, Spinner, Skeleton, ProgressBar, Icon } = window.ActiveKitDesignSystem_5626a0;

ReactDOM.createRoot(document.getElementById('root')).render(
  <div className="wrap">
    <div className="panel span2">
      <div className="cap">Action in flight, the button holds its label</div>
      <div className="row">
        <Button variant="primary" loading loadingLabel="Launching">Launch campaign</Button>
        <Button variant="brand" loading>Start free</Button>
        <Button variant="secondary" size="sm" loading>Saving</Button>
        <Button variant="ghost" size="sm" loading>Refreshing</Button>
        <span style={{width:'1px',height:'28px',background:'var(--hairline)'}} />
        <Spinner size="sm" label="Checking balance" />
        <Spinner size="md" />
        <Spinner size="lg" tone="brand" />
      </div>
    </div>

    <div className="panel">
      <div className="cap">Progress, known and unknown</div>
      <ProgressBar value={73} label="Credit balance" hint="18,240 of 25,000 this month" showValue />
      <ProgressBar label="Enrolling members" hint="Indeterminate, no count yet" />
      <ProgressBar value={38} size="sm" label="CSV import" showValue />
    </div>

    <div className="panel">
      <div className="cap">Metric cards, first load</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'var(--space-md)'}}>
        <div className="metric"><Skeleton variant="text" width="52%" /><Skeleton variant="metric" /></div>
        <div className="metric"><Skeleton variant="text" width="46%" /><Skeleton variant="metric" width="70%" /></div>
      </div>
      <Skeleton variant="chart" height="96px" />
    </div>

    <div className="panel">
      <div className="cap">Table rows, first load</div>
      {[0,1,2].map(i => (
        <div className="trow" key={i} style={i===0?{borderTop:'none'}:null}>
          <Skeleton variant="avatar" />
          <div style={{flex:1}}><Skeleton variant="text" lines={2} gap="var(--space-xs)" /></div>
          <Skeleton variant="pill" width="72px" />
        </div>
      ))}
    </div>

    <div className="panel dark">
      <div className="cap">Slate chrome</div>
      <Skeleton variant="title" tone="dark" width="58%" />
      <Skeleton variant="text" lines={3} tone="dark" />
      <div className="row" style={{paddingTop:'var(--space-sm)'}}>
        <Spinner tone="onDark" size="sm" label="Loading ledger" />
      </div>
      <ProgressBar value={61} tone="dark" size="sm" label="Payout batch" showValue />
    </div>
  </div>
);
</script></body></html>
