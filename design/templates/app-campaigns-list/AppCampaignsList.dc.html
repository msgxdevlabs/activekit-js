<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>

<main style="display:flex;flex-direction:column;min-width:0">

</x-import>
<div style="padding:var(--space-xl);display:flex;flex-direction:column;gap:var(--space-lg)">
<div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-lg);flex-wrap:wrap">
<div style="display:flex;gap:var(--space-xs);background:var(--canvas);border:var(--border-width-hairline) solid var(--hairline);border-radius:var(--radius-pill);padding:var(--space-xxs)">

<sc-if value="{{ isLive }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ pickLive }}" style="border:none;cursor:pointer;border-radius:var(--radius-pill);padding:var(--space-sm) var(--space-md);min-height:40px;font-family:var(--font-sans);font-size:var(--button-sm-size);line-height:var(--button-sm-lh);font-feature-settings:var(--font-feature-numeric);background:var(--cta-gradient);color:var(--cta-on-fill)">Live 9</button></sc-if>

<sc-if value="{{ isPaused }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ pickPaused }}" style="border:none;cursor:pointer;border-radius:var(--radius-pill);padding:var(--space-sm) var(--space-md);min-height:40px;font-family:var(--font-sans);font-size:var(--button-sm-size);line-height:var(--button-sm-lh);font-feature-settings:var(--font-feature-numeric);background:var(--cta-gradient);color:var(--cta-on-fill)">Paused 3</button></sc-if>
<sc-if value="{{ notPaused }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ pickPaused }}" style="border:none;cursor:pointer;border-radius:var(--radius-pill);padding:var(--space-sm) var(--space-md);min-height:40px;font-family:var(--font-sans);font-size:var(--button-sm-size);line-height:var(--button-sm-lh);font-feature-settings:var(--font-feature-numeric);background:transparent;color:var(--ink-mute)">Paused 3</button></sc-if>
<sc-if value="{{ isDraft }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ pickDraft }}" style="border:none;cursor:pointer;border-radius:var(--radius-pill);padding:var(--space-sm) var(--space-md);min-height:40px;font-family:var(--font-sans);font-size:var(--button-sm-size);line-height:var(--button-sm-lh);font-feature-settings:var(--font-feature-numeric);background:var(--cta-gradient);color:var(--cta-on-fill)">Draft 2</button></sc-if>
<sc-if value="{{ notDraft }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ pickDraft }}" style="border:none;cursor:pointer;border-radius:var(--radius-pill);padding:var(--space-sm) var(--space-md);min-height:40px;font-family:var(--font-sans);font-size:var(--button-sm-size);line-height:var(--button-sm-lh);font-feature-settings:var(--font-feature-numeric);background:transparent;color:var(--ink-mute)">Draft 2</button></sc-if>
</div>
<div style="width:300px">
<x-import component-from-global-scope="ActiveKitDesignSystem_5626a0.Input" placeholder="Search campaigns or triggers" value="{{ query }}" onChange="{{ onSearch }}" hint-size="100%,40px"></x-import>
</div>
</div>
<div style="background:var(--canvas);border:var(--border-width-hairline) solid var(--hairline);border-radius:var(--radius-lg);box-shadow:var(--elevation-1);overflow:hidden">
<sc-if value="{{ hasRows }}" hint-placeholder-val="{{ true }}">
<table style="width:100%;border-collapse:collapse;font-size:var(--body-tabular-size);letter-spacing:var(--body-tabular-ls);font-feature-settings:var(--font-feature-numeric)">
<thead><tr style="background:var(--canvas-soft)">
<th style="text-align:left;padding:var(--space-md) var(--space-xl);font-size:var(--micro-cap-size);letter-spacing:var(--micro-cap-ls);text-transform:uppercase;color:var(--ink-mute);font-weight:500;border-bottom:var(--border-width-hairline) solid var(--hairline)">Campaign</th>
<th style="text-align:left;padding:var(--space-md) var(--space-lg);font-size:var(--micro-cap-size);letter-spacing:var(--micro-cap-ls);text-transform:uppercase;color:var(--ink-mute);font-weight:500;border-bottom:var(--border-width-hairline) solid var(--hairline)">Trigger</th>
<th style="text-align:left;padding:var(--space-md) var(--space-lg);font-size:var(--micro-cap-size);letter-spacing:var(--micro-cap-ls);text-transform:uppercase;color:var(--ink-mute);font-weight:500;border-bottom:var(--border-width-hairline) solid var(--hairline)">Status</th>
<th style="text-align:right;padding:var(--space-md) var(--space-lg);font-size:var(--micro-cap-size);letter-spacing:var(--micro-cap-ls);text-transform:uppercase;color:var(--ink-mute);font-weight:500;border-bottom:var(--border-width-hairline) solid var(--hairline)">Reward</th>
<th style="text-align:right;padding:var(--space-md) var(--space-lg);font-size:var(--micro-cap-size);letter-spacing:var(--micro-cap-ls);text-transform:uppercase;color:var(--ink-mute);font-weight:500;border-bottom:var(--border-width-hairline) solid var(--hairline)">Enrolled</th>
<th style="text-align:right;padding:var(--space-md) var(--space-lg);font-size:var(--micro-cap-size);letter-spacing:var(--micro-cap-ls);text-transform:uppercase;color:var(--ink-mute);font-weight:500;border-bottom:var(--border-width-hairline) solid var(--hairline)">Completion</th>
<th style="text-align:right;padding:var(--space-md) var(--space-xl);font-size:var(--micro-cap-size);letter-spacing:var(--micro-cap-ls);text-transform:uppercase;color:var(--ink-mute);font-weight:500;border-bottom:var(--border-width-hairline) solid var(--hairline)">Credits paid</th>
</tr></thead>
<tbody>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
<tr>
<td style="padding:var(--space-md) var(--space-xl);border-bottom:var(--border-width-hairline) solid var(--hairline)"><a href="../app-campaign-detail/AppCampaignDetail.dc.html" style="display:block;color:var(--ink);font-size:var(--body-md-size);letter-spacing:0;text-decoration:none" style-hover="color:var(--primary-deep)">{{ r.name }}</a><div style="color:var(--ink-mute);font-size:var(--caption-size);letter-spacing:var(--caption-ls)">{{ r.version }}</div></td>
<td style="padding:var(--space-md) var(--space-lg);border-bottom:var(--border-width-hairline) solid var(--hairline);font-family:var(--font-mono);font-size:12px;color:var(--ink-secondary)">{{ r.trigger }}</td>
<td style="padding:var(--space-md) var(--space-lg);border-bottom:var(--border-width-hairline) solid var(--hairline)"><sc-if value="{{ r.isLive }}" hint-placeholder-val="{{ true }}"><span style="display:inline-block;border-radius:var(--radius-pill);padding:var(--pad-tag);font-size:var(--micro-cap-size);line-height:var(--micro-cap-lh);letter-spacing:var(--micro-cap-ls);text-transform:uppercase;white-space:nowrap;background:var(--surface-tag);color:var(--text-tag)">Live</span></sc-if><sc-if value="{{ r.isPaused }}" hint-placeholder-val="{{ false }}"><span style="display:inline-block;border-radius:var(--radius-pill);padding:var(--pad-tag);font-size:var(--micro-cap-size);line-height:var(--micro-cap-lh);letter-spacing:var(--micro-cap-ls);text-transform:uppercase;white-space:nowrap;background:var(--canvas-soft);color:var(--ink-mute)">Paused</span></sc-if><sc-if value="{{ r.isDraft }}" hint-placeholder-val="{{ false }}"><span style="display:inline-block;border-radius:var(--radius-pill);padding:var(--pad-tag);font-size:var(--micro-cap-size);line-height:var(--micro-cap-lh);letter-spacing:var(--micro-cap-ls);text-transform:uppercase;white-space:nowrap;background:var(--canvas-violet);color:var(--purple)">Draft</span></sc-if></td>
<td style="padding:var(--space-md) var(--space-lg);border-bottom:var(--border-width-hairline) solid var(--hairline);text-align:right;color:var(--ink-secondary)">{{ r.reward }}</td>
<td style="padding:var(--space-md) var(--space-lg);border-bottom:var(--border-width-hairline) solid var(--hairline);text-align:right;color:var(--ink-secondary)">{{ r.enrolled }}</td>
<td style="padding:var(--space-md) var(--space-lg);border-bottom:var(--border-width-hairline) solid var(--hairline);text-align:right;color:var(--ink-secondary)">{{ r.completion }}</td>
<td style="padding:var(--space-md) var(--space-xl);border-bottom:var(--border-width-hairline) solid var(--hairline);text-align:right;color:var(--ink)">{{ r.paid }}</td>
</tr>
</sc-for>
</tbody>
</table>
<div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-md);padding:var(--space-md) var(--space-xl);background:var(--canvas-soft);border-top:var(--border-width-hairline) solid var(--hairline);font-size:var(--caption-size);letter-spacing:var(--caption-ls);color:var(--ink-mute);font-feature-settings:var(--font-feature-numeric)">
<span>{{ resultCount }}</span>
<div style="display:flex;gap:var(--space-sm);align-items:center">
<x-import component-from-global-scope="ActiveKitDesignSystem_5626a0.Button" variant="secondary" size="sm" disabled="{{ true }}" hint-size="90px,40px">Previous</x-import>
<x-import component-from-global-scope="ActiveKitDesignSystem_5626a0.Button" variant="secondary" size="sm" hint-size="70px,40px">Next</x-import>
</div>
</div>
</sc-if>
<sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;align-items:center;padding-bottom:var(--space-xl)">
<x-import component-from-global-scope="ActiveKitDesignSystem_5626a0.EmptyState" icon="search" size="sm" title="{{ emptyTitle }}" description="Try a different trigger name, or clear the filter to see everything in this workspace." hint-size="100%,150px"></x-import>
<x-import component-from-global-scope="ActiveKitDesignSystem_5626a0.Button" variant="secondary" size="sm" onClick="{{ clearFilters }}" hint-size="120px,40px">Clear filters</x-import>
</div>
</sc-if>
</div>
</main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { filter: 'all', query: '' };

  data() {
    return [
      { name: 'Referral loop', version: 'v4, edited 2 hours ago', trigger: 'referral.completed', status: 'Live', reward: '1,000', enrolled: '10,480', completion: '61.0%', paid: '1,009,200' },
      { name: 'Onboarding streak', version: 'v2, edited 3 days ago', trigger: 'session.day_7', status: 'Live', reward: '250', enrolled: '908', completion: '40.8%', paid: '100,050' },
      { name: 'Win-back 21d', version: 'v1, edited 1 week ago', trigger: 'user.idle_21d', status: 'Live', reward: '500', enrolled: '1,100', completion: '08.4%', paid: '10,800' },
      { name: 'Team invite v2', version: 'draft, edited today', trigger: 'workspace.invite_sent', status: 'Draft', reward: '750', enrolled: '0', completion: '00.0%', paid: '0' },
      { name: 'Power user bonus', version: 'v3, paused 4 days ago', trigger: 'usage.p95_week', status: 'Paused', reward: '2,000', enrolled: '410', completion: '22.0%', paid: '4,100' },
      { name: 'Annual upgrade nudge', version: 'v1, edited 2 weeks ago', trigger: 'plan.viewed_annual', status: 'Live', reward: '1,500', enrolled: '2,240', completion: '31.6%', paid: '336,000' },
      { name: 'Docs completion', version: 'v1, paused 1 month ago', trigger: 'docs.guide_finished', status: 'Paused', reward: '100', enrolled: '3,808', completion: '55.2%', paid: '380,800' },
      { name: 'Referral loop EU', version: 'draft, edited yesterday', trigger: 'referral.completed', status: 'Draft', reward: '1,000', enrolled: '0', completion: '00.0%', paid: '0' }
    ];
  }

  renderVals() {
    const { filter, query } = this.state;
    const q = query.trim().toLowerCase();
    const rows = this.data()
      .filter((r) => filter === 'all' || r.status.toLowerCase() === filter)
      .filter((r) => !q || r.name.toLowerCase().includes(q) || r.trigger.toLowerCase().includes(q))
      .map((r) => Object.assign({}, r, {
        isLive: r.status === 'Live',
        isPaused: r.status === 'Paused',
        isDraft: r.status === 'Draft'
      }));

    return {
      sidebarItems: [
        { section: 'Workspace' },
        { label: 'Overview', href: '../app-dashboard/AppDashboard.dc.html', active: false },
        { label: 'Campaigns', badge: '4', href: '../app-campaigns-list/AppCampaignsList.dc.html', active: true },
        { label: 'Ledger', active: false },
        { section: 'Build' },
        { label: 'Developers', active: false },
        { label: 'Credits', href: '../app-credits-billing/AppCreditsBilling.dc.html', active: false },
        { label: 'Settings', href: '../app-settings/AppSettings.dc.html', active: false }
      ],
      sidebarWorkspace: { initials: 'PQ', name: 'Parseq', plan: 'Scale' },
      sidebarMeter: { label: 'Monthly cap', value: '25,000', note: '18,240 used this month', pct: 73 },
      sidebarUser: { initials: 'DW', name: 'Dana Whitlock', role: 'Owner' },
      rows,
      isEmpty: rows.length === 0,
      hasRows: rows.length > 0,
      emptyTitle: query ? 'No campaigns match \u201c' + query + '\u201d' : 'No campaigns match that filter',
      query,
      onSearch: (e) => this.setState({ query: e.target.value }),
      clearFilters: () => this.setState({ filter: 'all', query: '' }),
      pickAll: () => this.setState({ filter: 'all' }),
      pickLive: () => this.setState({ filter: 'live' }),
      pickPaused: () => this.setState({ filter: 'paused' }),
      pickDraft: () => this.setState({ filter: 'draft' }),
      isAll: filter === 'all',
      notAll: filter !== 'all',
      isLive: filter === 'live',
      notLive: filter !== 'live',
      isPaused: filter === 'paused',
      notPaused: filter !== 'paused',
      isDraft: filter === 'draft',
      notDraft: filter !== 'draft',
      resultCount: 'Showing ' + rows.length + ' of 14 campaigns'
    };
  }
}

</script>
</body>
</html>
