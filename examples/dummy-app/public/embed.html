<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ActiveKit</title>
<style>
	:root{
		--bg:#ffffff; --bg-soft:#f7fbff; --ink:#102033; --mute:#607087;
		--line:#e3ebf3; --brand:#087f7a; --brand-soft:#e6f4f3; --amber:#b45309;
		--slate:#0f1b2a; --slate-2:#16263a; --on-slate:#dce6f2;
	}
	:root[data-theme=dark]{
		--bg:#101a26; --bg-soft:#16222f; --ink:#e8eef5; --mute:#93a3b6;
		--line:#22303f; --brand:#14b8a8; --brand-soft:#123430; --amber:#f0a742;
		--slate:#0a121c; --slate-2:#111e2c; --on-slate:#dce6f2;
	}
	*{box-sizing:border-box;margin:0;padding:0}
	body{
		font:400 14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
		background:var(--bg); color:var(--ink); height:100vh; overflow:hidden;
		-webkit-font-smoothing:antialiased;
	}
	.app{display:grid;grid-template-columns:212px 1fr;height:100%}
	@media (max-width:720px){.app{grid-template-columns:1fr}.side{display:none}}

	/* ---- sidebar ---- */
	.side{background:var(--slate);color:var(--on-slate);padding:22px 16px;display:flex;flex-direction:column;gap:4px}
	.who{display:flex;align-items:center;gap:10px;margin-bottom:22px}
	.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#3ddbc9);
		display:grid;place-items:center;font-weight:700;color:#04241f;font-size:15px;flex:none}
	.who b{display:block;font-size:14px;font-weight:600}
	.who span{font-size:12px;opacity:.6}
	.nav{display:flex;flex-direction:column;gap:2px}
	.nav button{all:unset;display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;
		font-size:13.5px;cursor:pointer;color:var(--on-slate);opacity:.7;transition:background 140ms,opacity 140ms}
	.nav button:hover{background:rgba(255,255,255,.06);opacity:1}
	.nav button[aria-current=true]{background:rgba(255,255,255,.11);opacity:1;font-weight:600}
	.nav button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
	.nav svg{width:16px;height:16px;flex:none}
	.side footer{margin-top:auto;font-size:11px;opacity:.4;letter-spacing:.03em}

	/* ---- main ---- */
	.main{overflow-y:auto;padding:28px 32px 40px;background:var(--bg-soft)}
	@media (max-width:720px){.main{padding:22px 18px 32px}}
	h1{font-size:21px;font-weight:600;letter-spacing:-.01em;margin-bottom:3px}
	.sub{color:var(--mute);font-size:13.5px;margin-bottom:22px}
	.panel{display:none}
	.panel[data-on=true]{display:block;animation:rise .34s cubic-bezier(.2,0,0,1) both}
	@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

	/* ---- stat strip ---- */
	.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-bottom:24px}
	.stat{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
	.stat span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-weight:600}
	.stat b{display:block;font-size:25px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:3px}

	/* ---- XP ring ---- */
	.hero{display:flex;gap:22px;align-items:center;background:var(--bg);border:1px solid var(--line);
		border-radius:15px;padding:20px 22px;margin-bottom:24px}
	.ring{position:relative;width:96px;height:96px;flex:none}
	.ring svg{transform:rotate(-90deg)}
	.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
	.ring .bk{stroke:var(--line)}
	.ring .fg{stroke:var(--brand);stroke-dasharray:251.3;stroke-dashoffset:251.3;
		transition:stroke-dashoffset 1.1s cubic-bezier(.2,0,0,1)}
	.ring i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;
		font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
	.hero h2{font-size:16px;font-weight:600;margin-bottom:3px}
	.hero p{color:var(--mute);font-size:13.5px}

	/* ---- quest map ---- */
	.map{position:relative;background:linear-gradient(170deg,var(--brand-soft),var(--bg) 62%);
		border:1px solid var(--line);border-radius:15px;padding:22px;overflow:hidden;margin-bottom:24px}
	.map::after{content:"";position:absolute;inset:0;pointer-events:none;
		background:radial-gradient(420px 180px at 78% -12%,rgba(8,127,122,.14),transparent 70%)}
	.map h2{font-size:15px;font-weight:600;margin-bottom:2px}
	.map .sub{margin-bottom:18px}
	.track{position:relative;display:flex;justify-content:space-between;gap:6px;padding:14px 6px 4px}
	.track::before{content:"";position:absolute;left:26px;right:26px;top:35px;height:3px;border-radius:2px;
		background:var(--line)}
	.track::after{content:"";position:absolute;left:26px;top:35px;height:3px;border-radius:2px;
		background:var(--brand);width:var(--fill,0);transition:width 1.3s cubic-bezier(.2,0,0,1)}
	.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;width:19%;text-align:center}
	.dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;
		background:var(--bg);border:3px solid var(--line);color:var(--mute);
		opacity:0;transform:scale(.5);animation:pop .42s cubic-bezier(.2,0,.4,1.4) forwards}
	.node:nth-child(1) .dot{animation-delay:.10s} .node:nth-child(2) .dot{animation-delay:.20s}
	.node:nth-child(3) .dot{animation-delay:.30s} .node:nth-child(4) .dot{animation-delay:.40s}
	.node:nth-child(5) .dot{animation-delay:.50s}
	@keyframes pop{to{opacity:1;transform:none}}
	.node[data-s=done] .dot{background:var(--brand);border-color:var(--brand);color:#fff}
	.node[data-s=now] .dot{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 0 rgba(8,127,122,.42);
		animation:pop .42s cubic-bezier(.2,0,.4,1.4) forwards,beat 2.1s 1s ease-out infinite}
	@keyframes beat{0%{box-shadow:0 0 0 0 rgba(8,127,122,.42)}70%{box-shadow:0 0 0 13px rgba(8,127,122,0)}100%{box-shadow:0 0 0 0 rgba(8,127,122,0)}}
	.node b{font-size:12px;font-weight:600;line-height:1.3}
	.node span{font-size:11px;color:var(--mute)}
	.node[data-s=locked]{opacity:.45}

	/* ---- quest list ---- */
	.q{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin-bottom:10px;
		opacity:0;transform:translateY(9px);animation:rise .38s cubic-bezier(.2,0,0,1) forwards}
	.q:nth-child(1){animation-delay:.05s} .q:nth-child(2){animation-delay:.12s}
	.q:nth-child(3){animation-delay:.19s} .q:nth-child(4){animation-delay:.26s}
	.q header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px}
	.q b{font-size:14px;font-weight:600}
	.q .n{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
	.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
	.bar i{display:block;height:100%;border-radius:4px;background:var(--brand);width:0;
		transition:width 1.05s cubic-bezier(.2,0,0,1)}
	.q footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px}
	.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;
		background:var(--brand-soft);color:var(--brand)}
	.chip.a{background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber)}

	/* ---- badges ---- */
	.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
	.badge{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:16px 10px;text-align:center;
		opacity:0;transform:scale(.86);animation:pop .4s cubic-bezier(.2,0,.4,1.4) forwards}
	.badge:nth-child(1){animation-delay:.04s} .badge:nth-child(2){animation-delay:.10s}
	.badge:nth-child(3){animation-delay:.16s} .badge:nth-child(4){animation-delay:.22s}
	.badge:nth-child(5){animation-delay:.28s} .badge:nth-child(6){animation-delay:.34s}
	.badge em{display:block;width:44px;height:44px;margin:0 auto 8px;border-radius:12px;font-style:normal;
		display:grid;place-items:center;font-size:21px;
		background:linear-gradient(140deg,var(--brand),#3ddbc9)}
	.badge[data-locked=true] em{background:var(--line);filter:grayscale(1)}
	.badge[data-locked=true]{opacity:.5}
	.badge b{display:block;font-size:12.5px;font-weight:600}
	.badge span{font-size:11px;color:var(--mute)}

	.cta{all:unset;display:inline-block;margin-top:6px;padding:9px 15px;border-radius:9px;background:var(--brand);
		color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:filter 140ms,transform 140ms}
	.cta:hover{filter:brightness(1.08)} .cta:active{transform:translateY(1px)}
	.cta:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

	/* ---- confetti ---- */
	.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
	.fx i{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall 1.5s cubic-bezier(.3,.5,.6,1) forwards}
	@keyframes fall{
		0%{opacity:1;transform:translate3d(0,0,0) rotate(0)}
		100%{opacity:0;transform:translate3d(var(--dx),74vh,0) rotate(var(--rot))}
	}
	@media (prefers-reduced-motion:reduce){
		*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
	}
</style>
</head>
<body>
<div class="app">
	<aside class="side">
		<div class="who">
			<div class="av" id="ini">P</div>
			<div><b id="who">…</b><span id="lvl">Level 1</span></div>
		</div>
		<nav class="nav" id="nav">
			<button data-p="home" aria-current="true">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg> Adventure</button>
			<button data-p="quests">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg> Quests</button>
			<button data-p="badges">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 7 5-2.6L17 21l-1.5-7"/></svg> Badges</button>
		</nav>
		<footer>ActiveKit</footer>
	</aside>

	<main class="main">
		<!-- Adventure -->
		<section class="panel" data-panel="home" data-on="true">
			<h1>Your adventure</h1>
			<p class="sub" id="season">Season · loading…</p>

			<div class="stats">
				<div class="stat"><span>Coins</span><b id="coins">0</b></div>
				<div class="stat"><span>Streak</span><b id="streak">0</b></div>
				<div class="stat"><span>Badges</span><b id="bcount">0</b></div>
			</div>

			<div class="hero">
				<div class="ring">
					<svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
						<circle class="bk" cx="48" cy="48" r="40"></circle>
						<circle class="fg" id="ring" cx="48" cy="48" r="40"></circle>
					</svg>
					<i id="lvlnum">1</i>
				</div>
				<div>
					<h2 id="xptitle">Level 1</h2>
					<p id="xpsub">Loading your progress…</p>
					<button class="cta" id="claim">Complete a quest</button>
				</div>
			</div>

			<div class="map">
				<h2>Getting Started</h2>
				<p class="sub">Five nodes. Each one unlocks the next.</p>
				<div class="track" id="track"></div>
			</div>
		</section>

		<!-- Quests -->
		<section class="panel" data-panel="quests">
			<h1>Quests</h1>
			<p class="sub">Everything running this season.</p>
			<div id="qlist"></div>
		</section>

		<!-- Badges -->
		<section class="panel" data-panel="badges">
			<h1>Badges</h1>
			<p class="sub">Permanent. They survive the season ending.</p>
			<div class="badges" id="blist"></div>
		</section>
	</main>
</div>
<div class="fx" id="fx" aria-hidden="true"></div>

<script type="module" src="./embed.js"></script>
</body>
</html>
