<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ActiveKit</title>
<style>
	/* The two default widget templates, as one dressing and its inversion.
	   `activekit-dark` is the pre-selected default and `activekit-light` is the
	   same dressing with the palette inverted, which is the whole of the
	   difference between them. A template changes the dressing and never the
	   views: both draw Home and Map and nothing else.

	   `--ground` is the frame's own background, and it is the value posted to
	   the shell on `ready` so the frame it fades in behind matches the template
	   rendering inside it. */
	:root, :root[data-template="activekit-dark"]{
		--ground:#0b1220; --band:#0d1628; --ink:#f2f8fd; --mute:rgba(255,255,255,.6);
		--panel:rgba(255,255,255,.04); --line:rgba(255,255,255,.09); --chip:rgba(255,255,255,.07);
		--teal:#15c6bc; --teal-soft:#7ce8e2; --teal-wash:rgba(21,198,188,.16); --done:#0e4a45;
		--node:#17253d; --amber:#f59e0b; --amber-wash:rgba(245,158,11,.16); --amber-ink:#fef3e2;
		--ruby:#ef4da8; --ruby-wash:rgba(239,77,168,.16); --rail:rgba(255,255,255,.14);
	}
	:root[data-template="activekit-light"]{
		--ground:#ffffff; --band:#f7fbff; --ink:#102033; --mute:#607087;
		--panel:#f7fbff; --line:#dbe6ef; --chip:#f2f7fb;
		--teal:#00a7a0; --teal-soft:#087f7a; --teal-wash:#e4f8f6; --done:#e4f8f6;
		--node:#ffffff; --amber:#f59e0b; --amber-wash:#fef3e2; --amber-ink:#8a5200;
		--ruby:#ef4da8; --ruby-wash:#fdeaf4; --rail:#dbe6ef;
	}
	*{box-sizing:border-box;margin:0;padding:0}
	body{
		font:400 14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
		background:var(--ground); color:var(--ink); height:100vh; overflow:hidden;
		-webkit-font-smoothing:antialiased; font-feature-settings:"tnum","zero";
	}
	.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}

	/* ---- the band across the top: level, streak, the XP ladder ---- */
	.band{background:var(--band);border-bottom:1px solid var(--line);padding:18px 16px 14px;
		display:flex;flex-direction:column;gap:10px;flex:none}
	.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
	.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9999px;
		background:var(--chip);font-size:12px;white-space:nowrap}
	.chip.level{background:var(--teal-wash);color:var(--teal-soft);font-weight:600}
	.chip svg{width:12px;height:12px;flex:none}
	.ladder{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute)}
	.bar{height:5px;border-radius:9999px;background:var(--rail);overflow:hidden;flex:1}
	.bar i{display:block;height:100%;width:0;border-radius:9999px;background:var(--teal);
		transition:width 900ms cubic-bezier(.2,.8,.2,1)}
	.bar.amber i{background:var(--amber)} .bar.ruby i{background:var(--ruby)}

	/* ---- views ---- */
	.main{flex:1;overflow-y:auto;padding:16px 16px 20px;display:flex;flex-direction:column;gap:14px}
	.view{display:none;flex-direction:column;gap:14px}
	.view[data-on=true]{display:flex}
	.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;
		display:flex;flex-direction:column;gap:12px}
	.eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
	.title{font-size:15px;font-weight:600}
	.mute{color:var(--mute)}
	.small{font-size:12px}

	/* ---- the week strip: seven cells, and the one moving thing on Home ---- */
	.week{position:relative;display:flex;align-items:flex-start}
	.week .rail{position:absolute;left:18px;right:18px;top:17px;height:2px;background:var(--rail)}
	.week .prog{position:absolute;left:18px;top:17px;height:2px;width:0;background:var(--teal);
		transition:width 900ms cubic-bezier(.2,.8,.2,1)}
	.day{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0}
	.day .c{width:36px;height:36px;border-radius:9999px;display:flex;align-items:center;justify-content:center;
		border:2px solid var(--rail);background:var(--node);font-size:12px}
	.day .l{font-size:11px;color:var(--mute)}
	.day[data-s=done] .c{background:var(--done);border-color:var(--teal)}
	.day[data-s=now] .c{border-color:var(--teal);animation:pulse 2.4s ease-out infinite}
	.day[data-s=missed] .c{border-style:dashed;border-color:var(--ruby)}
	/* One pulse per screen. On Home it is the current day cell, on Map the hot
	   station, and a second mover on either is a bug: two things asking for
	   attention is nothing asking for it. */
	@keyframes pulse{
		0%{box-shadow:0 0 0 0 var(--teal-wash)}
		70%{box-shadow:0 0 0 12px transparent}
		100%{box-shadow:0 0 0 0 transparent}
	}

	/* ---- an objective row ---- */
	.obj{display:flex;align-items:center;gap:10px}
	.tick{width:22px;height:22px;border-radius:9999px;flex:none;display:flex;align-items:center;
		justify-content:center;border:1px solid var(--rail);background:transparent}
	.tick[data-s=done]{background:var(--done);border-color:var(--teal)}
	.tick[data-s=open]{border-style:dashed;border-color:var(--ruby)}
	.tick svg{width:12px;height:12px}
	.obj b{font-size:13px;font-weight:500;flex:1;min-width:0}
	.xp{padding:3px 7px;border-radius:9999px;background:var(--teal-wash);color:var(--teal-soft);
		font-size:11px;font-weight:500;white-space:nowrap}
	.coin{padding:3px 8px;border-radius:9999px;background:var(--amber-wash);color:var(--amber-ink);
		font-size:12px;font-weight:500;white-space:nowrap}

	/* ---- the event banner: urgency is ruby, never amber ---- */
	.banner{border-color:var(--ruby);background:var(--ruby-wash)}
	.banner .left{font-size:12px;color:var(--ruby)}

	/* ---- Map: the goal strip and the route ---- */
	.goal{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--band);
		border:1px solid var(--line);border-radius:14px}
	.goal .far{margin-left:auto;text-align:right}
	.goal .far b{display:block;font-size:15px;font-weight:600}
	.route{position:relative;min-height:340px;border:1px solid var(--line);border-radius:16px;
		background:var(--panel);overflow:hidden}
	.route svg.path{position:absolute;inset:0;width:100%;height:100%}
	.station{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
		align-items:center;gap:6px;width:112px;text-align:center}
	.station .n{width:40px;height:40px;border-radius:9999px;display:flex;align-items:center;
		justify-content:center;border:2px solid var(--rail);background:var(--node);font-size:13px}
	.station[data-s=done] .n{background:var(--done);border-color:var(--teal)}
	.station[data-s=hot] .n{border-color:var(--teal);animation:pulse 2.4s ease-out infinite}
	.station b{font-size:12px;font-weight:500;line-height:1.3}
	.station span{font-size:11px;color:var(--mute)}

	/* ---- bottom nav: two views, and only two ---- */
	.nav{display:flex;border-top:1px solid var(--line);background:var(--band);flex:none}
	.nav button{all:unset;flex:1;text-align:center;padding:12px 0;font-size:13px;color:var(--mute);
		cursor:pointer}
	.nav button[aria-current=true]{color:var(--teal-soft);font-weight:600}
	.nav button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
	.legal{padding:10px 16px 14px;font-size:11px;color:var(--mute);text-align:center;flex:none;
		background:var(--band)}

	@media (prefers-reduced-motion:reduce){
		*{animation-duration:.01ms!important;animation-iteration-count:1!important;
			transition-duration:.01ms!important}
	}
</style>
</head>
<body>
<div class="app">
	<div class="band">
		<div class="row">
			<div style="display:flex;gap:8px">
				<span class="chip level" id="level">Lv 1</span>
				<span class="chip" id="streak">
					<svg viewBox="0 0 12 12" fill="none" stroke="var(--amber)" stroke-width="1.5" aria-hidden="true"><path d="M6 1.5c1 2 3 3 3 5a3 3 0 1 1-6 0c0-1 .5-2 1.5-2.5"/></svg>
					<span id="streak-n">0</span>
				</span>
			</div>
			<span class="small mute" id="ladder-n">0 / 0</span>
		</div>
		<div class="ladder">
			<div class="bar"><i id="ladder-bar"></i></div>
		</div>
	</div>

	<div class="main">
		<!-- Home -->
		<section class="view" data-view="home" data-on="true">
			<div class="panel banner" id="banner" hidden>
				<div class="row">
					<div>
						<div class="eyebrow left" id="banner-eyebrow">Event</div>
						<div class="title" id="banner-title"></div>
					</div>
					<span class="coin" id="banner-reward"></span>
				</div>
				<div class="ladder">
					<div class="bar ruby"><i id="banner-bar"></i></div>
					<span id="banner-count"></span>
				</div>
			</div>

			<div class="panel">
				<div class="row">
					<div>
						<div class="eyebrow">Main quest</div>
						<div class="title" id="chain-title"></div>
					</div>
					<span class="coin" id="chain-reward"></span>
				</div>
				<div class="week" id="week"><div class="rail"></div><div class="prog" id="week-prog"></div></div>
				<div id="chain-steps" style="display:flex;flex-direction:column;gap:10px"></div>
			</div>

			<div class="panel">
				<div class="row">
					<div class="eyebrow">Today</div>
					<span class="small mute" id="today-left"></span>
				</div>
				<div id="today" style="display:flex;flex-direction:column;gap:10px"></div>
			</div>

			<div class="panel" id="side-panel">
				<div class="eyebrow">Side quests</div>
				<div id="side" style="display:flex;flex-direction:column;gap:12px"></div>
			</div>
		</section>

		<!-- Map -->
		<section class="view" data-view="map">
			<div class="goal">
				<div>
					<div class="title" id="goal-name"></div>
					<div class="small mute" id="goal-sub"></div>
				</div>
				<div class="far">
					<b id="goal-left"></b>
					<span class="small mute">objectives to go</span>
				</div>
			</div>
			<div class="route" id="route">
				<svg class="path" id="route-path" aria-hidden="true"></svg>
			</div>
		</section>
	</div>

	<nav class="nav" id="nav">
		<button data-view="home" aria-current="true">Home</button>
		<button data-view="map">Map</button>
	</nav>
	<!-- Quoted verbatim, never paraphrased: it is the sentence a payment
	     reviewer screens for. -->
	<p class="legal">ActiveKit issues no monetary value, holds no funds, and never pays out.</p>
</div>

<script type="module" src="./embed.js"></script>
</body>
</html>
